name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build src/WinCalendar/WinCalendar.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/WinCalendar.Tests/WinCalendar.Tests.csproj --no-restore --logger "console;verbosity=normal"

  installer:
    name: Build Installer
    needs: test
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write  # needed to create releases

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            # Read version from setup.iss for non-tag builds
            echo "value=$(grep '#define MyAppVersion' installer/setup.iss | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (self-contained)
        run: >
          dotnet publish src/WinCalendar/WinCalendar.csproj
          -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command ISCC -ErrorAction Stop).Source }
          & $iscc /DMyAppVersion="${{ steps.version.outputs.value }}" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: WinCalendar-${{ steps.version.outputs.value }}-setup
          path: installer/output/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            installer/output/*.exe
